name: Sync Luma events to Notion

on:
  # Twice daily — ~8 AM PT and ~8 PM PT (drift by 1 hour seasonally).
  schedule:
    - cron: "30 15 * * *"   # 15:30 UTC = 7:30 AM PST / 8:30 AM PDT
    - cron: "30 3 * * *"    # 03:30 UTC = 7:30 PM PST / 8:30 PM PDT

  # Manual trigger button in Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, no writes)"
        required: false
        type: boolean
        default: false

# Don't queue concurrent syncs.
concurrency:
  group: sync-notion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Luma → Notion
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          VENUE_TIMEZONE: America/Los_Angeles
          FRESHNESS_DAYS: "7"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/sync_notion.py
